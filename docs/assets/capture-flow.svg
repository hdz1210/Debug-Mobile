<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">App Network Debugger capture flow</title>
  <desc id="description">A mobile app sends traffic through the desktop proxy to an API server. App Network Debugger displays the request and response.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c121b"/>
      <stop offset="1" stop-color="#101b2d"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#5aa7ff"/>
    </marker>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <circle cx="76" cy="55" r="100" fill="#2563eb" opacity=".08"/>
  <circle cx="1135" cy="315" r="135" fill="#16a34a" opacity=".07"/>

  <text x="60" y="62" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">See every request, end to end</text>
  <text x="60" y="92" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="16">The phone uses the desktop app as its explicit Wi-Fi proxy.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="132" width="235" height="154" rx="20" fill="#151e2b" stroke="#2b3a4f"/>
    <rect x="482" y="120" width="236" height="178" rx="22" fill="url(#primary)"/>
    <rect x="905" y="132" width="235" height="154" rx="20" fill="#151e2b" stroke="#2b3a4f"/>
  </g>

  <g transform="translate(89 164)">
    <rect width="46" height="78" rx="9" fill="none" stroke="#5aa7ff" stroke-width="4"/>
    <circle cx="23" cy="66" r="3" fill="#5aa7ff"/>
    <path d="M13 18c6-6 14-6 20 0M17 24c4-4 8-4 12 0M22 30h2" fill="none" stroke="#5aa7ff" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="154" y="181" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Mobile app</text>
  <text x="154" y="211" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">iOS or Android</text>
  <text x="154" y="237" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">HTTP · HTTPS · WS</text>

  <g transform="translate(517 154)">
    <circle cx="30" cy="30" r="30" fill="#fff" opacity=".16"/>
    <path d="M16 30h28M30 16v28" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="590" y="174" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">App Network</text>
  <text x="590" y="201" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Debugger</text>
  <text x="518" y="250" fill="#e7f0ff" font-family="Segoe UI, Arial, sans-serif" font-size="15">Capture · inspect · diagnose</text>

  <g transform="translate(934 170)" fill="none" stroke="#5aa7ff" stroke-width="4">
    <ellipse cx="35" cy="10" rx="35" ry="10"/>
    <path d="M0 10v44c0 6 16 10 35 10s35-4 35-10V10M0 31c0 6 16 10 35 10s35-4 35-10"/>
  </g>
  <text x="1022" y="181" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">API server</text>
  <text x="1022" y="211" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Request payload</text>
  <text x="1022" y="237" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Response body</text>

  <path d="M315 209H455" stroke="#5aa7ff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M738 209H878" stroke="#5aa7ff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="335" y="190" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Wi-Fi proxy</text>
  <text x="754" y="190" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Forward traffic</text>

  <path d="M878 247H738" stroke="#34d399" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" opacity=".9"/>
  <text x="766" y="270" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Response</text>
</svg>
